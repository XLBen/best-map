<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 脚本的隔离：计算 Worker 从 data: 地址开（不透明的来源），也受这里的规则管：只能连同源（不能联网）。
         'unsafe-eval'：脚本要编译成函数才能运行（只在计算 Worker 里）。开发时 connect-src 另加热更新的 WebSocket -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' data: blob:; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>架空世界编辑器</title>
    <!-- 程序的文件没读到、读得很慢时（脚本一行都没跑，什么兜底都还没接上）：十秒后这一句自己显出来，页面不会一直是白的。
         程序起来以后第一件事就是把它拿掉（main.tsx），平常看不到 -->
    <style>
      .boot-wait {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 24px;
        text-align: center;
        font: 14px/1.7 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #dfe3e8;
        background: #15181d;
        opacity: 0;
        animation: boot-wait 0.3s linear 10s forwards;
      }
      @keyframes boot-wait {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><p class="boot-wait">页面还没打开：程序的文件没读到，或者读得很慢。请重新载入。已有的世界还存在这个浏览器里，不会丢。</p></div>
    <!-- 先接上全局的兜底（没接住的错、整页的自救页），再载入程序的主体：主体出错时页面不会只是白的 -->
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
